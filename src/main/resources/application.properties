spring.config.import=optional:file:.env[.properties]
spring.application.name=Smart Campus Attendance ERP
server.port=8081

spring.datasource.url=jdbc:h2:file:./data/smartcampus;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=always

# Gmail SMTP settings are supplied by the ignored local .env file.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.test-connection=false
app.mail.from=${SMTP_FROM:${SMTP_USERNAME:no-reply@example.invalid}}
app.security.reset-token-minutes=15

server.tomcat.max-connections=${SERVER_MAX_CONNECTIONS:200}
server.tomcat.accept-count=${SERVER_ACCEPT_COUNT:50}
server.tomcat.threads.max=${SERVER_MAX_THREADS:100}
server.tomcat.threads.min-spare=${SERVER_MIN_THREADS:10}
