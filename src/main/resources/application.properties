spring.application.name=Smart Campus Attendance ERP
server.port=8081
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_campus?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-mysql.sql
# SMTP: use a provider app password; never commit real credentials.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:mishrasatyam08885@gmail.com}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${SMTP_FROM:${SMTP_USERNAME:mishrasatyam08885@gmail.com}}
app.security.reset-token-minutes=15
# Local-only fallback for testing password reset without SMTP.
app.security.reset-token-expose=${RESET_TOKEN_EXPOSE:false}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8081}
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

server.tomcat.max-connections=${SERVER_MAX_CONNECTIONS:200}
server.tomcat.accept-count=${SERVER_ACCEPT_COUNT:50}
server.tomcat.threads.max=${SERVER_MAX_THREADS:100}
server.tomcat.threads.min-spare=${SERVER_MIN_THREADS:10}

app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin123@gmail.com}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

app.notifications.low-attendance-threshold=${LOW_ATTENDANCE_THRESHOLD:75}
app.notifications.cron=${ATTENDANCE_ALERT_CRON:0 0 8 * * *}
app.notifications.time-zone=${ATTENDANCE_ALERT_TIME_ZONE:Asia/Kolkata}
