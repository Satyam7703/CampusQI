<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in | CampusIQ</title><link rel="stylesheet" href="/styles.css">
<style>body{min-height:100vh;display:grid;place-items:center;background:#f7f8fc;padding:20px}.card{width:min(470px,100%);background:#fff;border:1px solid #e5e8f2;border-radius:24px;padding:30px;box-shadow:0 24px 70px #20254a12}.brand{font-size:25px;font-weight:900;color:#5145e5}.muted{color:#69718a;line-height:1.6;font-size:14px}.field{display:grid;gap:7px;margin:16px 0;font-size:13px;font-weight:700}.field input{padding:13px;border:1px solid #dce1eb;border-radius:10px;font:inherit}.primary{width:100%;padding:13px;border:0;border-radius:10px;background:#5145e5;color:white;font-weight:800;cursor:pointer}.primary:disabled{opacity:.6}.msg{display:none;margin-top:14px;padding:12px;border-radius:10px;background:#fff0f0;color:#a52a36;white-space:pre-wrap}.links{display:flex;justify-content:space-between;gap:10px;margin-top:18px;font-size:13px}.links a{color:#5145e5;text-decoration:none}</style>
</head>
<body><main class="card"><div class="brand">CampusIQ</div><small>SMART CAMPUS ATTENDANCE ERP</small><h1>Welcome back</h1><p class="muted">Use the email and password assigned by your administrator. Student face verification is available inside the student dashboard before attendance.</p>
<form id="form"><label class="field">Email<input id="email" type="email" autocomplete="username" required maxlength="160" placeholder="you@college.edu"></label><label class="field">Password<input id="password" type="password" autocomplete="current-password" required maxlength="72" placeholder="Your password"></label><button id="submit" class="primary">Sign in</button></form>
<div id="msg" class="msg" role="alert"></div><div class="links"><a href="/forgot-password.html">Forgot password?</a><a href="/">Main dashboard</a></div></main>
<script>
const $=s=>document.querySelector(s),form=$('#form'),msg=$('#msg'),submit=$('#submit');
function show(text,bad=true){msg.textContent=text;msg.style.display='block';msg.style.background=bad?'#fff0f0':'#f3f4f6';msg.style.color=bad?'#9f2222':'#374151'}
async function staffLogin(email,password){const r=await fetch('/api/staff-auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});let d={};try{d=await r.json()}catch{}return r.ok?d:null}
async function studentLogin(email,password){const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.message||d.error||'Invalid email or password');return d}
form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;show('Checking account…',false);try{const email=$('#email').value.trim(),password=$('#password').value;const staff=await staffLogin(email,password);if(staff){const role=String(staff.role||'').toUpperCase();localStorage.setItem('campusiq.staffToken',staff.token);localStorage.setItem('campusiq.staffRole',role);localStorage.setItem('campusiq.staffProfile',JSON.stringify({fullName:staff.fullName,email:staff.email,role}));location.replace(role==='ADMIN'?'/index.html?v=20261011-1':'/teacher-dashboard.html');return}const d=await studentLogin(email,password);localStorage.setItem('campusiq.student',JSON.stringify(d.student));localStorage.setItem('campusiq.studentToken',d.accessToken);localStorage.removeItem('campusiq.faceToken');location.href='/student-dashboard.html'}catch(err){show(err.message,true)}finally{submit.disabled=false}});
</script></body></html>
