<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Sign In | CampusIQ</title><link rel="stylesheet" href="/styles.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#f5f6fc}.card{width:min(440px,calc(100% - 28px));background:white;border:1px solid #e6e9f0;border-radius:20px;padding:30px;box-shadow:0 20px 60px #20233a12}.muted{color:#69718a;font-size:14px;line-height:1.6}.field{display:grid;gap:7px;margin:17px 0}.field input{padding:13px;border:1px solid #dce1eb;border-radius:10px;font:inherit}.primary{width:100%;padding:13px;border:0;border-radius:10px;background:#6256d9;color:white;font-weight:700;cursor:pointer}.msg{display:none;margin-top:14px;padding:12px;border-radius:10px;background:#fff0f0;color:#a52a36}.brand{font-weight:900;font-size:22px}.brand span{color:#6256d9}</style></head><body><script>location.replace('/login.html');</script><main class="card"><div class="brand">Campus<span>IQ</span></div><p class="muted">SECURE STAFF PORTAL</p><h1>Sign in</h1><p class="muted">Use your administrator or teacher account. Students should use face login.</p><form id="form"><label class="field">College email<input id="email" type="email" autocomplete="username" required maxlength="160"></label><label class="field">Password<input id="password" type="password" autocomplete="current-password" required maxlength="72"></label><button class="primary" id="submit">Sign in securely</button></form><div id="msg" class="msg" role="alert"></div><p class="muted"><a href="/forgot-password.html?account=staff">Forgot password?</a></p><p class="muted">First admin: set BOOTSTRAP_ADMIN_EMAIL and BOOTSTRAP_ADMIN_PASSWORD before launching the backend. Admins create teacher logins from Admin Management.</p><p class="muted"><a href="/login.html">Common login ↗</a></p></main><script>const form=document.querySelector('#form'),msg=document.querySelector('#msg'),btn=document.querySelector('#submit');form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Signing in…';msg.style.display='none';try{const r=await fetch('/api/staff-auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.querySelector('#email').value,password:document.querySelector('#password').value})});const d=await r.json();if(!r.ok)throw Error(d.message||'Sign in failed');const role=String(d.role||'').toUpperCase();localStorage.setItem('campusiq.staffToken',d.token);localStorage.setItem('campusiq.staffRole',role);localStorage.setItem('campusiq.staffProfile',JSON.stringify({fullName:d.fullName,email:d.email,role}));location.replace(role==='ADMIN'?'/index.html?v=20261011-1':'/teacher-dashboard.html')}catch(err){msg.textContent=err.message;msg.style.display='block'}finally{btn.disabled=false;btn.textContent='Sign in securely'}});</script></body></html>
