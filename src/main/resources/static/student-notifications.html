<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Notifications | CampusIQ</title><link rel="stylesheet" href="/styles.css"><style>.wrap{max-width:850px;margin:28px auto;padding:0 18px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.panel{background:white;border:1px solid #e5e8f0;border-radius:16px;padding:18px;margin-top:18px}.item{padding:15px 0;border-bottom:1px solid #edf0f5}.item:last-child{border:0}.item h3{font-size:15px;margin:0 0 7px}.item p{font-size:13px;line-height:1.6;color:#5f657a;margin:0 0 8px}.meta{font-size:11px;color:#82879a}.empty{padding:26px;text-align:center;color:#777d92}.error{padding:12px;border-radius:10px;background:#fff0f0;color:#a52a36;margin-top:14px;display:none}.btn{display:inline-block;border:1px solid #dce1eb;border-radius:10px;padding:10px 13px;text-decoration:none;color:#252a43;background:#fff;font-weight:700}</style></head><body><main class="wrap"><header class="head"><div><div class="eyebrow">CAMPUSIQ · STUDENT PORTAL</div><h1>My notifications</h1><p style="color:#777d92;font-size:13px">Attendance alerts and important account notices.</p></div><a class="btn" href="/student-dashboard.html">← My dashboard</a></header><div class="error" id="error"></div><section class="panel"><div id="items"><div class="empty">Loading notifications…</div></div></section></main><script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const val=(o,...keys)=>{for(const k of keys)if(o&&o[k]!==undefined&&o[k]!==null)return o[k];return ''};async function load(){const token=localStorage.getItem('campusiq.faceToken'),student=localStorage.getItem('campusiq.student');if(!token||!student){location.replace('/login.html');return}try{const r=await fetch('/api/student/notifications',{headers:{Authorization:'Bearer '+token,Accept:'application/json'}});let d;try{d=await r.json()}catch{d={}}if(!r.ok)throw Error(d.message||'Please sign in again');$('#items').innerHTML=d.length?d.map(x=>`<article class="item"><h3>${esc(val(x,'TITLE','title'))}</h3><p>${esc(val(x,'MESSAGE','message'))}</p><div class="meta">${esc(String(val(x,'CREATEDAT','createdAt')||'').replace('T',' ').slice(0,19))} · Email status: ${esc(val(x,'EMAILSTATUS','emailStatus')||'IN_APP_ONLY')}</div></article>`).join(''):'<div class="empty">You have no notifications right now. If attendance drops below the college threshold, an alert will appear here.</div>'}catch(e){$('#error').style.display='block';$('#error').textContent=e.message;$('#items').innerHTML=''}}load();
</script></body></html>
