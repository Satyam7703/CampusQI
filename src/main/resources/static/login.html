<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · CampusIQ</title><link rel="stylesheet" href="/styles.css"><style>body.auth-body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#e6eaff,transparent 36%),#f7f8fc;padding:24px}.auth-card{width:min(100%,440px);background:#fff;border:1px solid #e7e9f3;border-radius:24px;padding:34px;box-shadow:0 24px 70px #20254a12}.auth-brand{font-size:25px;font-weight:800;color:#4f46e5;margin-bottom:8px}.auth-card h1{font-size:27px;margin:18px 0 8px}.auth-card p{color:#6b7280;line-height:1.6}.auth-card label{display:block;font-size:13px;font-weight:700;margin:18px 0 7px}.auth-card input{width:100%;padding:13px 14px;border:1px solid #dfe3ef;border-radius:11px;font:inherit;box-sizing:border-box}.auth-card button{margin-top:20px;width:100%;border:0;border-radius:11px;background:#5145e5;color:white;padding:13px;font-weight:700;cursor:pointer}.auth-links{display:flex;justify-content:space-between;gap:12px;margin-top:18px;font-size:13px}.auth-links a{color:#5145e5;text-decoration:none}.notice{margin-top:16px;padding:12px;border-radius:10px;background:#f3f4f6;color:#374151;font-size:13px;display:none;white-space:pre-wrap}.back{display:inline-block;margin-top:22px;color:#6b7280;text-decoration:none;font-size:13px}</style></head><body class="auth-body"><main class="auth-card"><div class="auth-brand">CampusIQ</div><small>SMART CAMPUS ATTENDANCE ERP</small><h1>Welcome back</h1><p>Sign in with your college email. First-time users can set their password using the email reset flow.</p><form id="loginForm"><label for="email">College email</label><input id="email" type="email" autocomplete="username" required placeholder="you@college.edu"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Enter your password"><button type="submit">Sign in securely</button></form><div class="auth-links"><a href="/forgot-password.html">Forgot password?</a><a href="/">Admin dashboard ↗</a></div><div id="notice" class="notice" role="status"></div><a class="back" href="/">← Back to CampusIQ</a></main><script>const f=document.querySelector('#loginForm'),n=document.querySelector('#notice'),emailInput=document.querySelector('#email'),passwordInput=document.querySelector('#password');f.addEventListener('submit',async e=>{e.preventDefault();n.style.display='block';n.textContent='Checking credentials…';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:emailInput.value,password:passwordInput.value})});const d=await r.json();if(!r.ok)throw Error(d.message||d.error||'Login failed');n.textContent='Login verified for '+d.student.fullName+'. Redirecting to dashboard…';localStorage.setItem('campusiq.student',JSON.stringify(d.student));setTimeout(()=>location.href='/',700);}catch(err){n.textContent=err.message}});</script></body></html>
