<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set new password · CampusIQ</title><link rel="stylesheet" href="/styles.css"><style>
*{box-sizing:border-box}body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#e6eaff,transparent 36%),#f7f8fc;padding:24px;font-family:Arial,sans-serif;margin:0}.card{width:min(100%,440px);background:white;border:1px solid #e7e9f3;border-radius:24px;padding:clamp(22px,5vw,34px);box-shadow:0 24px 70px #20254a12}.brand{font-size:25px;font-weight:800;color:#5145e5}h1{margin:18px 0 8px;font-size:clamp(24px,6vw,30px)}p{color:#6b7280;line-height:1.6}label{display:block;font-size:13px;font-weight:700;margin:18px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #dfe3ef;border-radius:11px;font:inherit}button{margin-top:20px;width:100%;border:0;border-radius:11px;background:#5145e5;color:white;padding:13px;font-weight:700;cursor:pointer;min-height:46px}button:disabled{opacity:.6;cursor:wait}.notice{margin-top:16px;padding:12px;border-radius:10px;background:#f3f4f6;color:#374151;font-size:13px;display:none;white-space:pre-wrap;overflow-wrap:anywhere}.notice.error{background:#fff0f0;color:#9f2222}a{color:#5145e5;text-decoration:none}.small{font-size:12px}
</style></head><body><main class="card"><div class="brand">CampusIQ</div><small>ACCOUNT RECOVERY</small><h1 id="pageTitle">Set a new password</h1><p id="pageDescription">Your OTP has been verified. Create a strong password below. Use 10–72 characters with uppercase, lowercase, a number and a symbol.</p><form id="resetForm"><input id="resetToken" type="hidden" required><label for="newPassword">New password</label><input id="newPassword" type="password" required minlength="10" maxlength="72" autocomplete="new-password" placeholder="Create a strong password"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" required minlength="10" maxlength="72" autocomplete="new-password" placeholder="Enter it again"><button id="resetButton" type="submit">Reset password</button></form><div id="notice" class="notice" role="status" aria-live="polite"></div><p><a href="/login.html">← Back to sign in</a></p><p class="small">For your safety, reset links and tokens can only be used once and expire automatically.</p></main><script>
const form=document.getElementById('resetForm');const tokenInput=document.getElementById('resetToken');const passwordInput=document.getElementById('newPassword');const confirmInput=document.getElementById('confirmPassword');const button=document.getElementById('resetButton');const notice=document.getElementById('notice');
function showMessage(text,isError=false){notice.style.display='block';notice.classList.toggle('error',isError);notice.textContent=text}
const params=new URLSearchParams(window.location.search);const accountType=params.get('account')==='staff'?'STAFF':'STUDENT';tokenInput.value=params.get('token')||'';if(accountType==='STAFF'){document.title='Set staff password · CampusIQ';document.querySelector('small').textContent='STAFF ACCOUNT RECOVERY';document.querySelector('a[href="/login.html"]').href='/staff-login.html';}
if(!tokenInput.value){document.getElementById('pageTitle').textContent='Verify your OTP first';document.getElementById('pageDescription').textContent='Open Forgot Password and verify the OTP sent to your email before setting a new password.';button.disabled=true;passwordInput.disabled=true;confirmInput.disabled=true;}
form.addEventListener('submit',async event=>{event.preventDefault();if(passwordInput.value!==confirmInput.value){showMessage('The passwords do not match. Please enter them again.',true);confirmInput.focus();return}if(!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{10,72}$/.test(passwordInput.value)){showMessage('Password must be 10–72 characters and include uppercase, lowercase, a number and a symbol.',true);return}button.disabled=true;showMessage('Updating password…');try{const response=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tokenInput.value.trim(),newPassword:passwordInput.value,accountType})});const data=await response.json();if(!response.ok)throw new Error(data.message||data.error||'Password reset failed');form.reset();history.replaceState({},'',window.location.pathname);showMessage((data.message||'Password reset successful.')+' You can now sign in.');}catch(error){showMessage(error.message,true)}finally{button.disabled=false}});
</script></body></html>
