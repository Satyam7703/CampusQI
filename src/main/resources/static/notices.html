<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notices | CampusIQ</title><link rel="stylesheet" href="/styles.css"><style>main{max-width:900px;margin:30px auto;padding:0 20px}.card{background:#fff;border:1px solid #e6e9f0;border-radius:16px;padding:20px;margin:16px 0}.form{display:grid;gap:10px}.form input,.form textarea,.form select{padding:11px;border:1px solid #dce1eb;border-radius:9px;font:inherit}.form button{width:max-content}.notice{border-left:4px solid #5145e5;padding:12px 14px;margin:12px 0;background:#f8f8ff}.notice h3{margin:0 0 6px}.notice p{margin:0;color:#667085;white-space:pre-wrap}.delete{float:right}</style></head><body><main><p><a href="/admin-management.html">← Admin management</a></p><h1>Institute notices</h1><p>Publish notices for everyone, students or staff. Published notices appear inside the AI assistant.</p><section class="card"><form id="form" class="form"><input id="title" maxlength="180" placeholder="Notice title" required><textarea id="message" maxlength="2000" rows="4" placeholder="Notice message" required></textarea><select id="audience"><option value="ALL">Everyone</option><option value="STUDENT">Students only</option><option value="STAFF">Teachers and staff</option></select><button class="primary-btn" type="submit">Publish notice</button></form><p id="msg"></p></section><section class="card"><h2>Published notices</h2><div id="list">Loading…</div></section></main><script>
const token=localStorage.getItem('campusiq.staffToken');if(localStorage.getItem('campusiq.staffRole')!=='ADMIN'||!token)location.href='/common-login.html';const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const val=(o,...keys)=>{for(const key of keys)if(o&&o[key]!==undefined&&o[key]!==null)return o[key];return ''};async function call(path,opts={}){const r=await fetch('/api'+path,{...opts,cache:'no-store',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Request failed');return d}async function load(){const rows=await call('/notices');$('#list').innerHTML=rows.map(n=>{const id=val(n,'ID','id');return `<article class="notice"><button class="delete action" data-id="${esc(id)}">Delete</button><h3>${esc(val(n,'TITLE','title'))}</h3><p>${esc(val(n,'MESSAGE','message'))}</p><small>${esc(val(n,'AUDIENCE','audience'))} · ${esc(val(n,'CREATEDAT','createdAt')||'')}</small></article>`}).join('')||'<p>No notices yet.</p>'}$('#form').onsubmit=async e=>{e.preventDefault();try{await call('/notices',{method:'POST',body:JSON.stringify({title:$('#title').value,message:$('#message').value,audience:$('#audience').value})});$('#form').reset();$('#msg').textContent='Notice published.';await load()}catch(err){$('#msg').textContent=err.message}};$('#list').onclick=async e=>{const b=e.target.closest('[data-id]');if(b&&b.dataset.id&&confirm('Delete this notice for all users?')){try{await call('/notices/'+encodeURIComponent(b.dataset.id),{method:'DELETE'});$('#msg').textContent='Notice deleted for all users.';await load()}catch(err){$('#msg').textContent=err.message}}};load();
</script></body></html>
