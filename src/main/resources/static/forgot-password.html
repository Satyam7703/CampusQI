<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password · CampusIQ</title><link rel="stylesheet" href="/styles.css"><style>body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#e6eaff,transparent 36%),#f7f8fc;padding:24px;font-family:Arial,sans-serif}.card{width:min(100%,440px);background:white;border:1px solid #e7e9f3;border-radius:24px;padding:34px;box-shadow:0 24px 70px #20254a12}h1{margin:18px 0 8px}p{color:#6b7280;line-height:1.6}label{display:block;font-size:13px;font-weight:700;margin:18px 0 7px}input{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #dfe3ef;border-radius:11px;font:inherit}button{margin-top:20px;width:100%;border:0;border-radius:11px;background:#5145e5;color:white;padding:13px;font-weight:700;cursor:pointer}.notice{margin-top:16px;padding:12px;border-radius:10px;background:#f3f4f6;color:#374151;font-size:13px;display:none;white-space:pre-wrap}a{color:#5145e5;text-decoration:none}.brand{font-size:25px;font-weight:800;color:#5145e5}</style></head><body><main class="card"><div class="brand">CampusIQ</div><small>ACCOUNT RECOVERY</small><h1>Forgot your password?</h1><p>Enter your registered college email. We’ll send a one-time reset token if an active account matches.</p><form id="form"><label for="email">College email</label><input id="email" type="email" required placeholder="you@college.edu"><button>Send reset email</button></form><div id="notice" class="notice" role="status"></div><p><a href="/login.html">← Back to sign in</a></p></main><script>const form=document.querySelector('#form'),notice=document.querySelector('#notice');form.addEventListener('submit',async e=>{e.preventDefault();notice.style.display='block';notice.textContent='Sending request…';try{const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value})});const d=await r.json();if(!r.ok)throw Error(d.message||d.error||'Request failed');notice.textContent=d.message+' Check your inbox and spam folder.'}catch(err){notice.textContent=err.message}});</script></body></html>
